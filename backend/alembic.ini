# Alembic configuration.
#
#   cd backend
#   alembic upgrade head          # create/upgrade the schema
#   alembic check                 # confirm models and schema agree
#   alembic downgrade base        # drop everything this project created
#
# There is deliberately no sqlalchemy.url here: the connection string is a
# secret and lives in backend/.env. alembic/env.py reads it via app.config.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
