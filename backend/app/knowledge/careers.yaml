# Career knowledge base for the AI Career Counsellor.
#
# This file answers exactly one question: "what does this career require?"
# It is hand-curated. The Coursera dataset is never the source of career truth.
#
# Fields
#   id                   stable snake_case identifier
#   name                 label shown to the student
#   short_description    one sentence, used by the LLM when explaining a match
#   expected_experience  beginner | intermediate | advanced -- the level a
#                        student typically enters this role at. Deliberately the
#                        same three-point scale as Coursera's Difficulty, so
#                        experience fit and course difficulty fit share one scale.
#   interest_tags        from the interest_tags enum; feeds the 25% interest term
#   work_tags            from the work_tags enum; feeds the 15% preference term
#   required_skills      skill id + importance + required_level
#                          importance     0..1 weight in the career score
#                          required_level 0..1 proficiency the role expects;
#                                         gap = required_level - student_level
#
# importance and required_level are separate on purpose: a skill can be very
# important to a role but only needed at a shallow level (a Data Analyst needs
# some Python, not deep Python), and the scoring and gap calculations use them
# for different things.
#
# Skills with no Coursera coverage (version_control, api_design,
# model_deployment, mlops) appear here on purpose. Omitting them would make the
# skill gaps dishonest; the application reports that the catalogue has no
# suitable course rather than substituting an unrelated one.

