# Canonical skill taxonomy for the AI Career Counsellor.
#
# This file is the single source of truth for skill identity and for how raw
# Coursera skill strings are normalized. Normalization is deterministic: a plain
# lookup table, resolved once at ingestion. No LLM, no embeddings, no fuzzy
# matching.
#
# Fields
#   id            stable snake_case identifier used everywhere else
#   name          human-readable label shown in the UI
#   category      grouping, from the `categories` enum below
#   kind          concept | language | tool | platform | human
#                 kind: human => contributes to career fit but never drives
#                 course recommendations (approved decision 9)
#   aliases       exact raw strings as they appear in the Coursera dataset.
#                 Every alias is asserted to exist in the dataset by validation,
#                 so a typo cannot silently drop courses. An empty list means the
#                 dataset has no coverage for this skill -- that is intentional
#                 and the application must say so honestly (approved decision 6).
#   prerequisites skill ids that should be learned first; forms a DAG used for
#                 roadmap sequencing (approved decision 8)
#   related       adjacent skills used only to offer proxy courses when `aliases`
#                 is empty. Never treated as equivalent to the skill itself.
#
# Splitting rule (see "IMPORTANT TAXONOMY NOTE" in the approved design):
# a raw token becomes its own skill rather than an alias when it names a
# technology a student would claim or want to learn by name AND that distinction
# changes career matching or course recommendation. So TensorFlow is a tool with
# Deep Learning as a prerequisite -- not an alias of it -- and Docker and
# Kubernetes are separate skills, because "knows Docker" and "knows Kubernetes"
# are different statements about a candidate. Conversely IBM Cloud stays an alias
# of Cloud Computing: no career on our list requires it specifically, so a
# separate skill would add noise without adding a decision.

