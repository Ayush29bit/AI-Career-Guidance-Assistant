# Raw Coursera tokens we deliberately do not map. Listing them explicitly (rather
# than silently ignoring anything unrecognised) means validation can assert an
# exact partition of the dataset vocabulary: every raw token is either an alias
# or listed here. A newly appearing token therefore fails validation instead of
# vanishing unnoticed.
#
# Three reasons appear here:
#   - out of scope for tech/data careers (finance, marketing, HR, sales, ops)
#   - too ambiguous to map safely ("Apache" -- server? Spark? Kafka?)
#   - too generic to carry meaning ("Information Technology", "Health")
